<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111317" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <title>404 — Sayfa Bulunamadı</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111317;color:#f2f4f7;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(720px,100%);text-align:left;padding:52px 0;border-top:1px solid rgba(255,255,255,.08)}
    span{color:#8f959d;font:650 12px ui-monospace,monospace;letter-spacing:.08em}
    h1{font-size:clamp(44px,10vw,88px);line-height:.98;margin:22px 0;letter-spacing:-.06em;font-weight:680}
    p{color:#8f959d;max-width:480px;margin:0 0 28px}
    a{display:inline-flex;padding:11px 16px;border-radius:10px;background:#d8dfeb;color:#111317;font-weight:750;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <span>404 / NOT FOUND</span>
    <h1>Bu sayfa bulunamadı.</h1>
    <p>Bağlantı taşınmış, silinmiş veya artık kullanılmıyor olabilir.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
